version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ktordb
      POSTGRES_USER: ktoruser
      POSTGRES_PASSWORD: ktorpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktoruser -d ktordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python AI Detection Service
  python-server:
    build:
      context: ./detection
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      - DEBUG=true
      - VIDEO_PATH=/app/resources/1.mp4
      - HOST=0.0.0.0
      - PORT=1234
    volumes:
      - ./detection/resources:/app/resources
      - ./detection/model:/app/model
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ktor Backend Server
  ktor-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DETECTION_SERVICE_URL=http://python-server:1234
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ktordb
      - DATABASE_USER=ktoruser
      - DATABASE_PASSWORD=ktorpass
    depends_on:
      postgres:
        condition: service_healthy
      python-server:
        condition: service_healthy
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/system/overview"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ktor-server
      - python-server
    networks:
      - traffic-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  traffic-network:
    driver: bridge